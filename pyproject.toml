[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "faceswap-stream"
version = "0.1.0"
description = "Real-time face swap pipeline for OBS streaming"
requires-python = ">=3.11"

[project.scripts]
faceswap-stream = "app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
